{% macro render_field(field, input_class='form-control') %}
<div class="mb-3">
    {{ field.label(class='form-label') }}
    {{ field(class=input_class ~ (' is-invalid' if field.errors else '')) }}
    {% for error in field.errors %}
        <div class="invalid-feedback">{{ error }}</div>
    {% endfor %}
</div>
{% endmacro %}
