{% extends "base.html" %}

{% block content %}
<section>
    <p>Видалити пост <strong>{{ post.title }}</strong>?</p>

    <form method="post">
        {{ form.hidden_tag() }}

        {% for error in form.csrf_token.errors %}
            <p class="text-danger">{{ error }}</p>
        {% endfor %}

        {{ form.submit(class='btn btn-danger') }}
        <a class="btn btn-outline-secondary"
           href="{{ url_for('posts.detail_post', post_id=post.id) }}">
            Скасувати
        </a>
    </form>
</section>
{% endblock %}
