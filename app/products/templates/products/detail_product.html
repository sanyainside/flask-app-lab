{% extends "base.html" %}

{% block content %}
<section>
    {% include "products/product_image.html" %}
    <h2>Опис товару</h2>
    <p>{{ product.content }}</p>
    <p><strong>Ціна:</strong> {{ product.price }} $</p>
    <p>Категорія: {{ product.category }}</p>
    <p>У наявності: {{ product.quantity }} шт.</p>
    <a class="btn btn-primary"
        href="{{ url_for('products.product_edit', product_id=product.id) }}">
        Редагувати
    </a>
    <a class="btn btn-outline-primary" href="{{ url_for('products.product_list') }}">
        Назад до списку
    </a>
</section>
{% endblock %}
