{% extends "base.html" %}

{% block content %}
{% for product in products %}
    <section>
        <h2>{{ product.name }}</h2>
        <p>Ціна: {{ product.price }} $</p>
        <a class="btn btn-primary"
           href="{{ url_for('products.product_detail', product_id=product.id) }}">
            Детальніше
        </a>
    </section>
{% endfor %}
{% endblock %}
